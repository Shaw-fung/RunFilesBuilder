name: Make QuickFile run files

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Fetch latest release tag
        id: fetch_latest_tag
        run: |
          latest_tag=$(curl -s https://api.github.com/repos/sbwml/luci-app-quickfile/releases/latest | jq -r '.tag_name')
          echo "LATEST_TAG=$latest_tag" >> $GITHUB_ENV

      - name: Install makeself
        run: sudo apt-get update && sudo apt-get install -y makeself curl

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Download latest quickfile files
        run: |
          curl -LO $(curl -s https://api.github.com/repos/sbwml/luci-app-quickfile/releases/latest | grep -oP '"browser_download_url":\s*".*quickfile_x86_64-openwrt-24.10.tar.gz"' | cut -d '"' -f 4)
          curl -LO $(curl -s https://api.github.com/repos/sbwml/luci-app-quickfile/releases/latest | grep -oP '"browser_download_url":\s*".*quickfile_aarch64_cortex-a53-openwrt-24.10.tar.gz"' | cut -d '"' -f 4)
          curl -LO $(curl -s https://api.github.com/repos/sbwml/luci-app-quickfile/releases/latest | grep -oP '"browser_download_url":\s*".*quickfile_arm_cortex-a7_neon-vfpv4-openwrt-24.10.tar.gz"' | cut -d '"' -f 4)
          tar --one-top-level=quickfile_x86_64-openwrt-24.10 -xvzf quickfile_x86_64-openwrt-24.10.tar.gz
          tar --one-top-level=quickfile_aarch64_cortex-a53-openwrt-24.10 -xvzf quickfile_aarch64_cortex-a53-openwrt-24.10.tar.gz
          tar --one-top-level=quickfile_arm_cortex-a7_neon-vfpv4-openwrt-24.10 -xvzf quickfile_arm_cortex-a7_neon-vfpv4-openwrt-24.10.tar.gz

      - name: Organize files
        run: |
          mkdir x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4
          cp quickfile_x86_64-openwrt-24.10/*.ipk x86_64/
          cp quickfile_aarch64_cortex-a53-openwrt-24.10/*.ipk aarch64_cortex-a53/
          cp quickfile_arm_cortex-a7_neon-vfpv4-openwrt-24.10/*.ipk arm_cortex-a7_neon-vfpv4/
          pushd "x86_64" >/dev/null || exit 1
          for file in *~*.ipk; do
            [ -e "$file" ] || continue
            new_file="$(echo "$file" | tr -d '~')"
            if [ -e "$new_file" ]; then
              echo "目标文件已存在，跳过: $new_file"
              continue
            fi
            mv "$file" "$new_file"
            echo "已重命名: $file -> $new_file"
          done
          popd >/dev/null
          pushd "aarch64_cortex-a53" >/dev/null || exit 1
          for file in *~*.ipk; do
            [ -e "$file" ] || continue
            new_file="$(echo "$file" | tr -d '~')"
            if [ -e "$new_file" ]; then
              echo "目标文件已存在，跳过: $new_file"
              continue
            fi
            mv "$file" "$new_file"
            echo "已重命名: $file -> $new_file"
          done
          popd >/dev/null
          pushd "arm_cortex-a7_neon-vfpv4" >/dev/null || exit 1
          for file in *~*.ipk; do
            [ -e "$file" ] || continue
            new_file="$(echo "$file" | tr -d '~')"
            if [ -e "$new_file" ]; then
              echo "目标文件已存在，跳过: $new_file"
              continue
            fi
            mv "$file" "$new_file"
            echo "已重命名: $file -> $new_file"
          done
          popd >/dev/null

      - name: Create install.sh and pack
        run: |
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            cat <<EOF > "$ARCH/install.sh"
          #!/bin/sh
          opkg update
          if [ \$? -ne 0 ]; then
              echo "update failed"
              exit 1
          fi
          opkg install *.ipk --force-depends
          EOF
            chmod +x "$ARCH/install.sh"
          done
          mkdir -p output
          cd makeself
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            mv ../$ARCH .
            ./makeself.sh $ARCH/ ../output/quickfile_${{ env.LATEST_TAG }}_${ARCH}.run "QuickFile ${ARCH} v${{ env.LATEST_TAG }}" ./install.sh
          done

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "QuickFile"
          name: "QuickFile-latest"
          body: "QuickFile - 轻量级 OpenWrt/LuCI 网页文件管理器"
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
