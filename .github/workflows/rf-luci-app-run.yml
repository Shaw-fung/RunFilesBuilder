#=================================================
# Build RunFiles for luci-app-run (wukongdaily)
# 分包策略: ipk 和 apk 分别打包成独立的 .run 文件
#   - *_ipk_*.run  → 供 24.10 (opkg) 构建拉取
#   - *_apk_*.run  → 供 25.12 (apk) 构建拉取
# 文件名 _all 标识通用架构,便于被
# ImmortalWrt-ImageBuilder 的 build24.sh / build25.sh 抓取
#=================================================
name: Make luci-app-run run files

on:
  workflow_dispatch:
  schedule:
    # 凌晨 0 点 (北京时间) 执行 = 16:00 UTC 前一天
    - cron: '0 16 * * *'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch latest release info from wukongdaily/luci-app-run
        id: fetch_latest_release
        run: |
          latest_tag=$(curl -s https://api.github.com/repos/wukongdaily/luci-app-run/releases/latest | jq -r '.tag_name')
          echo "LATEST_TAG=$latest_tag" >> $GITHUB_ENV
          echo "📋 Latest luci-app-run version: $latest_tag"

      - name: Install makeself
        run: sudo apt-get update && sudo apt-get install -y makeself curl jq

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Download luci-app-run packages (ipk + apk)
        run: |
          mkdir -p downloads
          # 下载最新 release 的全部资产 (同时包含 .ipk 和 .apk)
          curl -s https://api.github.com/repos/wukongdaily/luci-app-run/releases/latest \
            | jq -r '.assets[] | "\(.name) \(.browser_download_url)"' \
            | while read -r name url; do
                echo "⬇️ Downloading: $name"
                curl -sL -o "downloads/$name" "$url"
              done
          echo "📦 Downloaded files:"
          ls -lh downloads/

      - name: Organize ipk and apk into separate dirs
        run: |
          # 24.10 分包: 仅含 .ipk
          mkdir -p ipk-pkg
          cp downloads/*.ipk ipk-pkg/ 2>/dev/null || echo "⚠️ No .ipk found"
          cat <<'EOF' > ipk-pkg/install.sh
          #!/bin/sh
          # luci-app-run installer for OpenWrt 24.10 (opkg)
          opkg update
          opkg install *.ipk --force-depends
          EOF
          chmod +x ipk-pkg/install.sh
          echo "📦 ipk-pkg contents:"
          ls -lh ipk-pkg/

          # 25.12 分包: 仅含 .apk
          mkdir -p apk-pkg
          cp downloads/*.apk apk-pkg/ 2>/dev/null || echo "⚠️ No .apk found"
          cat <<'EOF' > apk-pkg/install.sh
          #!/bin/sh
          # luci-app-run installer for ImmortalWrt 25.12 (apk)
          apk add --no-cache --allow-untrusted *.apk || true
          EOF
          chmod +x apk-pkg/install.sh
          echo "📦 apk-pkg contents:"
          ls -lh apk-pkg/

      - name: Create self-extracting packages (分包)
        run: |
          mkdir -p output
          VERSION=$(date -u -d '+8 hour' +'%Y-%m-%d')
          cd makeself

          # ipk 分包 (24.10) - 文件名含 _ipk_ 和 _all 标识
          mv ../ipk-pkg .
          ./makeself.sh ipk-pkg/ ../output/luci-app-run-${VERSION}_ipk_all.run "luci-app-run v${{ env.LATEST_TAG }} (ipk for 24.10)" ./install.sh

          # apk 分包 (25.12) - 文件名含 _apk_ 和 _all 标识
          mv ../apk-pkg .
          ./makeself.sh apk-pkg/ ../output/luci-app-run-${VERSION}_apk_all.run "luci-app-run v${{ env.LATEST_TAG }} (apk for 25.12)" ./install.sh

      - name: Check file sizes
        run: |
          ls -lh output/*.run

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "luci-app-run"
          name: "luci-app-run-latest"
          body: |
            luci-app-run: 轻量级 LuCI 应用,用于上传并运行 makeself 生成的 .run 安装程序。

            分包策略 (便于 ImmortalWrt-ImageBuilder 各版本精确抓取):
            - `luci-app-run-<date>_ipk_all.run` → 24.10 构建 (opkg 安装 .ipk)
            - `luci-app-run-<date>_apk_all.run` → 25.12 构建 (apk 安装 .apk)

            文件名标识:
            - `_ipk_` → 仅供 24.10 抓取
            - `_apk_` → 仅供 25.12 抓取
            - `_all` → 通用架构 (arm/aarch64 均可用)

            源仓库: https://github.com/wukongdaily/luci-app-run
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
