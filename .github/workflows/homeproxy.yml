#=================================================
# https://github.com/wukongdaily/RunFilesBuilder
# Modified: split ipk/apk packages for 24.10/25.12
# Source: dl.openwrt.ai kiddin9 feed
#=================================================
name: Make HomeProxy run files

on:
  workflow_dispatch:
  schedule:
    # 凌晨 1 点 (北京时间) 执行 = 17:00 UTC 前一天
    - cron: '0 17 * * *'

jobs:
  make-run:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3

      - name: 📦 安装 makeself 工具
        run: sudo apt-get update && sudo apt-get install -y makeself curl

      - name: 🚀 下载 24.10 ipk (HomeProxy)
        run: |
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            mkdir -p "ipk-$ARCH"
            # luci-app 从 kiddin9
            BASE_URL="https://dl.openwrt.ai/packages-24.10/${ARCH}/kiddin9/"
            page_content=$(curl -s "$BASE_URL")
            for prefix in luci-app-homeproxy luci-i18n-homeproxy-zh-cn; do
              match=$(echo "$page_content" | grep -oP 'href="\K[^"]+\.ipk' | grep "^${prefix}_" | head -n1)
              if [ -n "$match" ]; then
                echo "⬇️ $ARCH (24.10): $match"
                curl -sL -o "ipk-${ARCH}/${match}" "${BASE_URL}${match}"
                # 处理 ~ 字符
                if echo "$match" | grep -q '~'; then
                  new_name=$(basename "$match" | tr '~' '-')
                  mv "ipk-${ARCH}/${match}" "ipk-${ARCH}/${new_name}"
                fi
              else
                echo "⚠️ $ARCH: not found: $prefix"
              fi
            done
            # sing-box 从 packages
            BASE_URL="https://dl.openwrt.ai/packages-24.10/${ARCH}/packages/"
            page_content=$(curl -s "$BASE_URL")
            for prefix in sing-box; do
              match=$(echo "$page_content" | grep -oP 'href="\K[^"]+\.ipk' | grep "^${prefix}_" | head -n1)
              if [ -n "$match" ]; then
                echo "⬇️ $ARCH (24.10): $match"
                curl -sL -o "ipk-${ARCH}/${match}" "${BASE_URL}${match}"
              else
                echo "⚠️ $ARCH: not found: $prefix"
              fi
            done
          done

      - name: 🚀 下载 25.12 兼容包 (HomeProxy)
        run: |
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            mkdir -p "apk-$ARCH"
            # luci-app 从 kiddin9
            BASE_URL="https://dl.openwrt.ai/packages-25.12/${ARCH}/kiddin9/"
            page_content=$(curl -s "$BASE_URL")
            for prefix in luci-app-homeproxy luci-i18n-homeproxy-zh-cn; do
              match=$(echo "$page_content" | grep -oP 'href="\K[^"]+\.ipk' | grep "^${prefix}_" | head -n1)
              if [ -n "$match" ]; then
                echo "⬇️ $ARCH (25.12): $match"
                curl -sL -o "apk-${ARCH}/${match}" "${BASE_URL}${match}"
                if echo "$match" | grep -q '~'; then
                  new_name=$(basename "$match" | tr '~' '-')
                  mv "apk-${ARCH}/${match}" "apk-${ARCH}/${new_name}"
                fi
              else
                echo "⚠️ $ARCH: not found: $prefix"
              fi
            done
            # sing-box 从 packages
            BASE_URL="https://dl.openwrt.ai/packages-25.12/${ARCH}/packages/"
            page_content=$(curl -s "$BASE_URL")
            for prefix in sing-box; do
              match=$(echo "$page_content" | grep -oP 'href="\K[^"]+\.ipk' | grep "^${prefix}_" | head -n1)
              if [ -n "$match" ]; then
                echo "⬇️ $ARCH (25.12): $match"
                curl -sL -o "apk-${ARCH}/${match}" "${BASE_URL}${match}"
              else
                echo "⚠️ $ARCH: not found: $prefix"
              fi
            done
          done

      - name: 🔍 提取版本号并打包
        id: pack
        run: |
          git clone https://github.com/megastep/makeself.git
          mkdir -p output

          # 获取版本
          APP_IPK=$(ls ipk-x86_64/luci-app-homeproxy_*.ipk 2>/dev/null | head -n 1)
          if [ -z "$APP_IPK" ]; then
            echo "❌ 无法提取版本号"
            exit 1
          fi
          VERSION=$(basename "$APP_IPK" | sed -n 's/^luci-app-homeproxy_\(.*\)_all\.ipk$/\1/p' | tr '~' '-')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "版本: $VERSION"

          # ipk 包 (24.10)
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A ipk-$ARCH/*.ipk 2>/dev/null)" ]; then
              continue
            fi
            cat <<'EOF' > "ipk-$ARCH/install.sh"
          #!/bin/sh
          opkg update
          if [ $? -ne 0 ]; then
              echo "update failed"
              exit 1
          fi
          opkg install *.ipk --force-depends
          EOF
            chmod +x "ipk-$ARCH/install.sh"
            mv "ipk-$ARCH" makeself/
            cd makeself
            ./makeself.sh "ipk-$ARCH/" "../output/luci-app-homeproxy_${VERSION}_ipk_${ARCH}.run" "homeproxy ${ARCH} v${VERSION} (ipk for 24.10)" ./install.sh
            cd ..
          done

          # apk 包 (25.12)
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A apk-$ARCH/*.ipk 2>/dev/null)" ]; then
              continue
            fi
            cat <<'EOF' > "apk-$ARCH/install.sh"
          #!/bin/sh
          apk add --no-cache --allow-untrusted *.ipk 2>/dev/null || opkg install *.ipk --force-depends
          EOF
            chmod +x "apk-$ARCH/install.sh"
            mv "apk-$ARCH" makeself/
            cd makeself
            ./makeself.sh "apk-$ARCH/" "../output/luci-app-homeproxy_${VERSION}_apk_${ARCH}.run" "homeproxy ${ARCH} v${VERSION} (apk for 25.12)" ./install.sh
            cd ..
          done

      - name: Check file sizes
        run: |
          ls -lh output/*.run

      - name: 📤 上传 .run 文件到 release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "homeproxy-${{ steps.pack.outputs.version }}"
          name: "homeproxy-${{ steps.pack.outputs.version }}"
          body: |
            HomeProxy (luci-app-homeproxy + sing-box)

            分包策略:
            - luci-app-homeproxy_*_ipk_*.run → 24.10 构建 (opkg 安装 .ipk)
            - luci-app-homeproxy_*_apk_*.run → 25.12 构建 (apk 安装 .ipk 兼容)

            文件名标识:
            - _ipk_ → 仅供 24.10 抓取
            - _apk_ → 仅供 25.12 抓取

            源: dl.openwrt.ai (kiddin9 feed + packages)
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
