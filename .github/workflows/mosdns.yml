#=================================================

name: Make MosDNS run files

on:
  workflow_dispatch:
  schedule:
    # 凌晨 1 点 (北京时间) 执行 = 17:00 UTC 前一天
    - cron: '0 17 * * *'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch latest release tag from mosdns
        id: fetch_latest_tag
        run: |
          latest_tag=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/sbwml/luci-app-mosdns/releases | \
            grep "tag_name" | grep v5 | head -n 1 | awk -F ":" '{print $2}' | sed 's/"//g;s/,//;s/ //')
          echo "LATEST_TAG=$latest_tag" >> $GITHUB_ENV
          echo "📌 最新 tag: $latest_tag"

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Download 24.10 ipk packages (tar.gz)
        run: |
          echo "Downloading MosDNS 24.10 IPK packages..."
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sbwml/luci-app-mosdns/releases")

          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            mkdir -p "ipk-$ARCH"
            URL=$(echo "$RELEASE_INFO" | grep "browser_download_url" | grep "${{ env.LATEST_TAG }}" | grep "${ARCH}-openwrt-24.10.tar.gz" | head -1 | awk -F '"' '{print $4}')
            if [ -n "$URL" ]; then
              echo "⬇️ $ARCH (24.10 ipk): $(basename $URL)"
              curl --connect-timeout 30 -m 600 -kLo "${ARCH}_24.10.tar.gz" "$URL"
              tar -xzf "${ARCH}_24.10.tar.gz" -C "ipk-$ARCH" --strip-components=1 2>/dev/null || \
                tar -xzf "${ARCH}_24.10.tar.gz" -C "ipk-$ARCH"
              rm -f "${ARCH}_24.10.tar.gz"
              ls -lh "ipk-$ARCH/"
            else
              echo "⚠️ $ARCH: 24.10 ipk tar.gz not found"
            fi
          done

      - name: Download 25.12 apk packages (tar.gz)
        run: |
          echo "Downloading MosDNS 25.12 APK packages..."
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sbwml/luci-app-mosdns/releases")

          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            mkdir -p "apk-$ARCH"
            URL=$(echo "$RELEASE_INFO" | grep "browser_download_url" | grep "${{ env.LATEST_TAG }}" | grep "${ARCH}-openwrt-25.12.tar.gz" | head -1 | awk -F '"' '{print $4}')
            if [ -n "$URL" ]; then
              echo "⬇️ $ARCH (25.12 apk): $(basename $URL)"
              curl --connect-timeout 30 -m 600 -kLo "${ARCH}_25.12.tar.gz" "$URL"
              tar -xzf "${ARCH}_25.12.tar.gz" -C "apk-$ARCH" --strip-components=1 2>/dev/null || \
                tar -xzf "${ARCH}_25.12.tar.gz" -C "apk-$ARCH"
              rm -f "${ARCH}_25.12.tar.gz"
              ls -lh "apk-$ARCH/"
            else
              echo "⚠️ $ARCH: 25.12 apk tar.gz not found"
            fi
          done

      - name: Create install.sh and pack (ipk 分包 - 24.10)
        run: |
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A ipk-$ARCH/ 2>/dev/null | grep -E '\.(ipk|IPK)$')" ]; then
              echo "⚠️ $ARCH: 无 ipk 包,跳过打包"
              continue
            fi
            cat <<EOF > "ipk-$ARCH/install.sh"
          #!/bin/sh
          opkg update
          if [ \$? -ne 0 ]; then
              echo "update failed。"
              exit 1
          fi
          opkg install *.ipk
          EOF
            chmod +x "ipk-$ARCH/install.sh"
          done
          mkdir -p output
          cd makeself
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A ../ipk-$ARCH/ 2>/dev/null | grep -E '\.(ipk|IPK)$')" ]; then
              continue
            fi
            mv ../ipk-$ARCH .
            # 文件名含 _ipk_ 标识,供 24.10 (opkg) 构建抓取
            ./makeself.sh ipk-$ARCH/ ../output/mosdns_${{ env.LATEST_TAG }}_ipk_${ARCH}.run "mosdns ${{ env.LATEST_TAG }} ${ARCH} (ipk for 24.10)" ./install.sh
          done

      - name: Create install.sh and pack (apk 分包 - 25.12)
        run: |
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A apk-$ARCH/ 2>/dev/null | grep -E '\.(apk|APK)$')" ]; then
              echo "⚠️ $ARCH: 无 apk 包,跳过打包"
              continue
            fi
            cat <<EOF > "apk-$ARCH/install.sh"
          #!/bin/sh
          apk add --no-cache --allow-untrusted *.apk || true
          EOF
            chmod +x "apk-$ARCH/install.sh"
          done
          cd makeself
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A ../apk-$ARCH/ 2>/dev/null | grep -E '\.(apk|APK)$')" ]; then
              continue
            fi
            mv ../apk-$ARCH .
            # 文件名含 _apk_ 标识,供 25.12 (apk) 构建抓取
            ./makeself.sh apk-$ARCH/ ../output/mosdns_${{ env.LATEST_TAG }}_apk_${ARCH}.run "mosdns ${{ env.LATEST_TAG }} ${ARCH} (apk for 25.12)" ./install.sh
          done

      - name: Check file sizes
        run: |
          ls -lh output/*.run

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: ${{ env.LATEST_TAG }}
          name: "mosdns-${{ env.LATEST_TAG }}"
          files: output/*.run
          body: |
            MosDNS for OpenWrt / ImmortalWrt

            分包策略:
            - mosdns_*_ipk_*.run → 24.10 构建 (opkg 安装 .ipk)
            - mosdns_*_apk_*.run → 25.12 构建 (apk 安装 .apk)

            文件名标识:
            - _ipk_ → 仅供 24.10 抓取
            - _apk_ → 仅供 25.12 抓取

            源仓库: https://github.com/sbwml/luci-app-mosdns
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
