name: Make AdGuardHome run files

on:
  workflow_dispatch:
      inputs:
        package_version:
          description: '这里是包版本'
          required: false
          default: 'packages-24.10'
  schedule:
    # 凌晨 3 点 (北京时间) 执行 = 19:00 UTC 前一天
    - cron: '0 19 * * *'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch latest release tag from AdGuardHome
        id: fetch_latest_tag
        run: |
          latest_tag=$(curl -s https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest | jq -r '.tag_name')
          echo "LATEST_TAG=$latest_tag" >> $GITHUB_ENV

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Download latest AdGuardHome binaries
        run: |
          curl -LO "https://github.com/AdguardTeam/AdGuardHome/releases/download/${{ env.LATEST_TAG }}/AdGuardHome_linux_armv7.tar.gz"
          tar --one-top-level=AdGuardHome_aarch32 -xvzf AdGuardHome_linux_armv7.tar.gz
          
          curl -LO "https://github.com/AdguardTeam/AdGuardHome/releases/download/${{ env.LATEST_TAG }}/AdGuardHome_linux_arm64.tar.gz"
          tar --one-top-level=AdGuardHome_aarch64 -xvzf AdGuardHome_linux_arm64.tar.gz
          
          curl -LO "https://github.com/AdguardTeam/AdGuardHome/releases/download/${{ env.LATEST_TAG }}/AdGuardHome_linux_amd64.tar.gz"
          tar --one-top-level=AdGuardHome_x86_64 -xvzf AdGuardHome_linux_amd64.tar.gz

      - name: Download 24.10 luci-app-adguardhome IPK files
        run: |
          # 架构映射: OpenWrt arch -> 二进制目录短名
          declare -A ARCH_MAP=(
            [arm_cortex-a7_neon-vfpv4]=aarch32
            [aarch64_cortex-a53]=aarch64
            [x86_64]=x86_64
          )
          for ARCH in arm_cortex-a7_neon-vfpv4 aarch64_cortex-a53 x86_64; do
            SHORT="${ARCH_MAP[$ARCH]}"
            BASE_URL="https://dl.openwrt.ai/packages-24.10/${ARCH}/kiddin9/"
            page_content=$(curl -s "$BASE_URL")
            match=$(echo "$page_content" | grep -oP 'href="\K[^"]+\.ipk' | grep "^luci-app-adguardhome_" | head -n1)
            if [ -n "$match" ]; then
              echo "⬇️ $ARCH (24.10): $match"
              # 处理 ~ 字符
              safe_name=$(echo "$match" | tr '~' '-')
              curl -sL -o "AdGuardHome_${SHORT}/${safe_name}" "${BASE_URL}${match}"
            else
              # 回退到旧版本固定 ipk
              echo "⚠️ $ARCH: 未找到最新版,使用固定版本"
              curl -sL -o "AdGuardHome_${SHORT}/luci-app-adguardhome-all.ipk" \
                "https://github.com/wukongdaily/RunFilesBuilder/releases/download/AdGuardHome_v0.107.55/luci-app-adguardhome-all.ipk"
            fi
          done

      - name: Download 25.12 luci-app-adguardhome IPK files (apk-installable)
        run: |
          # 架构映射: OpenWrt arch -> 二进制目录短名
          declare -A ARCH_MAP=(
            [arm_cortex-a7_neon-vfpv4]=aarch32
            [aarch64_cortex-a53]=aarch64
            [x86_64]=x86_64
          )
          for ARCH in arm_cortex-a7_neon-vfpv4 aarch64_cortex-a53 x86_64; do
            SHORT="${ARCH_MAP[$ARCH]}"
            mkdir -p "AdGuardHome_apk_${SHORT}"
            # 复制二进制
            cp -r "AdGuardHome_${SHORT}/AdGuardHome" "AdGuardHome_apk_${SHORT}/" 2>/dev/null || true
            # 复制所有非 ipk 内容
            for f in "AdGuardHome_${SHORT}"/*; do
              [ -f "$f" ] && [ "${f##*.}" != "ipk" ] && cp "$f" "AdGuardHome_apk_${SHORT}/"
            done
            # 下载 25.12 版本的 ipk
            BASE_URL="https://dl.openwrt.ai/packages-25.12/${ARCH}/kiddin9/"
            page_content=$(curl -s "$BASE_URL")
            match=$(echo "$page_content" | grep -oP 'href="\K[^"]+\.ipk' | grep "^luci-app-adguardhome_" | head -n1)
            if [ -n "$match" ]; then
              echo "⬇️ $ARCH (25.12): $match"
              safe_name=$(echo "$match" | tr '~' '-')
              curl -sL -o "AdGuardHome_apk_${SHORT}/${safe_name}" "${BASE_URL}${match}"
            else
              echo "⚠️ $ARCH: 未找到 25.12 版本,使用固定版本"
              curl -sL -o "AdGuardHome_apk_${SHORT}/luci-app-adguardhome-all.ipk" \
                "https://github.com/wukongdaily/RunFilesBuilder/releases/download/AdGuardHome_v0.107.55/luci-app-adguardhome-all.ipk"
            fi
          done

      - name: Create install.sh scripts (ipk 24.10)
        run: |
          for ARCH in x86_64 aarch64 aarch32; do
            cat <<EOF > AdGuardHome_${ARCH}/install.sh
          #!/bin/sh
          opkg update
          if [ \$? -ne 0 ]; then
              echo "update failed。"
              exit 1
          fi
          # install luci-app-adguardhome IPK
          echo "Installing luci-app-adguardhome ipk"
          if ! opkg install *.ipk 2>/dev/null; then
            echo "Package install failed"
            exit 1
          fi
          # update latest AdGuardHome Core
          cp AdGuardHome/AdGuardHome /usr/bin/AdGuardHome
          chmod +x /usr/bin/AdGuardHome
          EOF
            chmod +x AdGuardHome_${ARCH}/install.sh
          done

      - name: Create install.sh scripts (apk 25.12)
        run: |
          for ARCH in x86_64 aarch64 aarch32; do
            cat <<EOF > AdGuardHome_apk_${ARCH}/install.sh
          #!/bin/sh
          # install luci-app-adguardhome (apk mode first, fallback to opkg)
          echo "Installing luci-app-adguardhome"
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache --allow-untrusted *.ipk 2>/dev/null || true
          else
            opkg update
            opkg install *.ipk --force-depends
          fi
          # update latest AdGuardHome Core
          cp AdGuardHome/AdGuardHome /usr/bin/AdGuardHome
          chmod +x /usr/bin/AdGuardHome
          EOF
            chmod +x AdGuardHome_apk_${ARCH}/install.sh
          done

      - name: Move directories to makeself and pack
        run: |
          mkdir -p output
          mv AdGuardHome_x86_64 makeself/
          mv AdGuardHome_aarch64 makeself/
          mv AdGuardHome_aarch32 makeself/
          mv AdGuardHome_apk_x86_64 makeself/
          mv AdGuardHome_apk_aarch64 makeself/
          mv AdGuardHome_apk_aarch32 makeself/

          cd makeself
          # ipk 分包 (24.10)
          ./makeself.sh AdGuardHome_x86_64/ ../output/AdGuardHome_${{ env.LATEST_TAG }}_ipk_x86_64.run "AdGuardHome ${{ env.LATEST_TAG }} x86_64 (ipk for 24.10)" ./install.sh
          ./makeself.sh AdGuardHome_aarch64/ ../output/AdGuardHome_${{ env.LATEST_TAG }}_ipk_aarch64.run "AdGuardHome ${{ env.LATEST_TAG }} aarch64 (ipk for 24.10)" ./install.sh
          ./makeself.sh AdGuardHome_aarch32/ ../output/AdGuardHome_${{ env.LATEST_TAG }}_ipk_aarch32.run "AdGuardHome ${{ env.LATEST_TAG }} aarch32 (ipk for 24.10)" ./install.sh
          
          # apk 分包 (25.12)
          ./makeself.sh AdGuardHome_apk_x86_64/ ../output/AdGuardHome_${{ env.LATEST_TAG }}_apk_x86_64.run "AdGuardHome ${{ env.LATEST_TAG }} x86_64 (apk for 25.12)" ./install.sh
          ./makeself.sh AdGuardHome_apk_aarch64/ ../output/AdGuardHome_${{ env.LATEST_TAG }}_apk_aarch64.run "AdGuardHome ${{ env.LATEST_TAG }} aarch64 (apk for 25.12)" ./install.sh
          ./makeself.sh AdGuardHome_apk_aarch32/ ../output/AdGuardHome_${{ env.LATEST_TAG }}_apk_aarch32.run "AdGuardHome ${{ env.LATEST_TAG }} aarch32 (apk for 25.12)" ./install.sh

      - name: Check file sizes
        run: |
          ls -lh output/AdGuardHome*.run

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: AdGuardHome_${{ env.LATEST_TAG }}
          name: "AdGuardHome-${{ env.LATEST_TAG }}"
          body: |
            AdGuardHome for OpenWrt / ImmortalWrt

            分包策略:
            - AdGuardHome_*_ipk_*.run → 24.10 构建 (opkg 安装 .ipk)
            - AdGuardHome_*_apk_*.run → 25.12 构建 (apk 安装 .ipk 兼容)

            文件名标识:
            - _ipk_ → 仅供 24.10 抓取
            - _apk_ → 仅供 25.12 抓取

            核心二进制来自: https://github.com/AdguardTeam/AdGuardHome
            LuCI 界面来自: dl.openwrt.ai (kiddin9 feed)
          files: output/AdGuardHome*.run
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
