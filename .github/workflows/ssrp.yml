#=================================================
# https://github.com/wukongdaily/RunFilesBuilder
# Modified: split ipk/apk packages for 24.10/25.12
# Source: dl.openwrt.ai kiddin9 feed
#=================================================
name: Make ShadowsocksPlus+ run files

on:
  workflow_dispatch:
  schedule:
    # 凌晨 2 点 (北京时间) 执行 = 18:00 UTC 前一天
    - cron: '0 18 * * *'

jobs:
  build:
    runs-on: ubuntu-22.04
   
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: 下载 24.10 ipk 包 (SSRP)
        run: |
          FILE_PREFIXES=("shadowsocks-libev-ss-server" "dns2tcp" "lua-neturl" "chinadns-ng" "dns2socks" "hysteria" "ipt2socks" "microsocks" "mosdns" "naiveproxy" "redsocks2" "shadowsocksr-libev" "shadowsocks-rust" "shadow-tls" "simple-obfs-client" "tcping" "trojan" "tuic-client" "v2ray-plugin" "xray-core" "luci-app-ssr-plus")
          EXCLUDE_PREFIXES=("luci-app-chinadns-ng" "luci-app-microsocks" "luci-app-mosdns" "luci-app-naiveproxy" "luci-app-redsocks2" "luci-app-shadowsocks")

          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            mkdir -p "ipk-$ARCH/depends"

            BASE_URL="https://dl.openwrt.ai/packages-24.10/${ARCH}/kiddin9/"
            echo "Fetching $ARCH kiddin9 from $BASE_URL"
            page=$(wget -qO- "$BASE_URL")
            while IFS= read -r LINE; do
              for PREFIX in "${FILE_PREFIXES[@]}"; do
                if [[ "$LINE" == *"$PREFIX"* ]]; then
                  FILE=$(echo "$LINE" | grep -oP 'href="\K[^"]*')
                  [[ -z "$FILE" ]] && continue
                  exclude_file=false
                  for exclude_prefix in "${EXCLUDE_PREFIXES[@]}"; do
                    if [[ "$FILE" == $exclude_prefix* ]]; then
                      exclude_file=true
                      break
                    fi
                  done
                  if $exclude_file; then
                    continue
                  fi
                  FILE_URL="${BASE_URL}${FILE}"
                  echo "⬇️ $ARCH (24.10): $FILE"
                  curl -sL --fail "$FILE_URL" -o "ipk-${ARCH}/depends/$(basename $FILE_URL)"
                fi
              done
            done <<< "$page"

            # base 目录
            BASE_URL="https://dl.openwrt.ai/packages-24.10/${ARCH}/base/"
            page=$(wget -qO- "$BASE_URL")
            while IFS= read -r LINE; do
              for PREFIX in "libopenssl3" "libudns"; do
                if [[ "$LINE" == *"$PREFIX"* ]]; then
                  FILE=$(echo "$LINE" | grep -oP 'href="\K[^"]*')
                  [[ -z "$FILE" ]] && continue
                  FILE_URL="${BASE_URL}${FILE}"
                  echo "⬇️ $ARCH (24.10 base): $FILE"
                  curl -sL --fail "$FILE_URL" -o "ipk-${ARCH}/depends/$(basename $FILE_URL)"
                fi
              done
            done <<< "$page"

            # packages 目录
            BASE_URL="https://dl.openwrt.ai/packages-24.10/${ARCH}/packages/"
            page=$(wget -qO- "$BASE_URL")
            while IFS= read -r LINE; do
              for PREFIX in "libudns"; do
                if [[ "$LINE" == *"$PREFIX"* ]]; then
                  FILE=$(echo "$LINE" | grep -oP 'href="\K[^"]*')
                  [[ -z "$FILE" ]] && continue
                  FILE_URL="${BASE_URL}${FILE}"
                  echo "⬇️ $ARCH (24.10 packages): $FILE"
                  curl -sL --fail "$FILE_URL" -o "ipk-${ARCH}/depends/$(basename $FILE_URL)"
                fi
              done
            done <<< "$page"
          done

          # 处理文件名 ~ 字符
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            pushd "ipk-$ARCH/depends" >/dev/null
            for f in *~*.ipk; do
              [ -e "$f" ] || continue
              new_f=$(echo "$f" | tr '~' '-')
              [ "$f" != "$new_f" ] && mv "$f" "$new_f"
            done
            popd >/dev/null
          done

          # 移除多余文件并移动主程序
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            rm -f "ipk-$ARCH/depends/luci-app-trojan-server"*
            mv "ipk-$ARCH/depends/luci-app-ssr-plus"*.ipk "ipk-$ARCH/" 2>/dev/null || true
          done

      - name: 下载 25.12 兼容包 (SSRP)
        run: |
          FILE_PREFIXES=("shadowsocks-libev-ss-server" "dns2tcp" "lua-neturl" "chinadns-ng" "dns2socks" "hysteria" "ipt2socks" "microsocks" "mosdns" "naiveproxy" "redsocks2" "shadowsocksr-libev" "shadowsocks-rust" "shadow-tls" "simple-obfs-client" "tcping" "trojan" "tuic-client" "v2ray-plugin" "xray-core" "luci-app-ssr-plus")
          EXCLUDE_PREFIXES=("luci-app-chinadns-ng" "luci-app-microsocks" "luci-app-mosdns" "luci-app-naiveproxy" "luci-app-redsocks2" "luci-app-shadowsocks")

          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            mkdir -p "apk-$ARCH/depends"

            BASE_URL="https://dl.openwrt.ai/packages-25.12/${ARCH}/kiddin9/"
            echo "Fetching $ARCH kiddin9 from $BASE_URL"
            page=$(wget -qO- "$BASE_URL")
            while IFS= read -r LINE; do
              for PREFIX in "${FILE_PREFIXES[@]}"; do
                if [[ "$LINE" == *"$PREFIX"* ]]; then
                  FILE=$(echo "$LINE" | grep -oP 'href="\K[^"]*')
                  [[ -z "$FILE" ]] && continue
                  exclude_file=false
                  for exclude_prefix in "${EXCLUDE_PREFIXES[@]}"; do
                    if [[ "$FILE" == $exclude_prefix* ]]; then
                      exclude_file=true
                      break
                    fi
                  done
                  if $exclude_file; then
                    continue
                  fi
                  FILE_URL="${BASE_URL}${FILE}"
                  echo "⬇️ $ARCH (25.12): $FILE"
                  curl -sL --fail "$FILE_URL" -o "apk-${ARCH}/depends/$(basename $FILE_URL)"
                fi
              done
            done <<< "$page"

            # base 目录
            BASE_URL="https://dl.openwrt.ai/packages-25.12/${ARCH}/base/"
            page=$(wget -qO- "$BASE_URL")
            while IFS= read -r LINE; do
              for PREFIX in "libopenssl3" "libudns"; do
                if [[ "$LINE" == *"$PREFIX"* ]]; then
                  FILE=$(echo "$LINE" | grep -oP 'href="\K[^"]*')
                  [[ -z "$FILE" ]] && continue
                  FILE_URL="${BASE_URL}${FILE}"
                  echo "⬇️ $ARCH (25.12 base): $FILE"
                  curl -sL --fail "$FILE_URL" -o "apk-${ARCH}/depends/$(basename $FILE_URL)"
                fi
              done
            done <<< "$page"

            # packages 目录
            BASE_URL="https://dl.openwrt.ai/packages-25.12/${ARCH}/packages/"
            page=$(wget -qO- "$BASE_URL")
            while IFS= read -r LINE; do
              for PREFIX in "libudns"; do
                if [[ "$LINE" == *"$PREFIX"* ]]; then
                  FILE=$(echo "$LINE" | grep -oP 'href="\K[^"]*')
                  [[ -z "$FILE" ]] && continue
                  FILE_URL="${BASE_URL}${FILE}"
                  echo "⬇️ $ARCH (25.12 packages): $FILE"
                  curl -sL --fail "$FILE_URL" -o "apk-${ARCH}/depends/$(basename $FILE_URL)"
                fi
              done
            done <<< "$page"
          done

          # 处理文件名 ~ 字符
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            pushd "apk-$ARCH/depends" >/dev/null
            for f in *~*.ipk; do
              [ -e "$f" ] || continue
              new_f=$(echo "$f" | tr '~' '-')
              [ "$f" != "$new_f" ] && mv "$f" "$new_f"
            done
            popd >/dev/null
          done

          # 移除多余文件并移动主程序
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            rm -f "apk-$ARCH/depends/luci-app-trojan-server"*
            mv "apk-$ARCH/depends/luci-app-ssr-plus"*.ipk "apk-$ARCH/" 2>/dev/null || true
          done

      - name: Parse version from filename
        id: setver
        run: |
          file=$(ls ipk-x86_64/luci-app-ssr-plus*.ipk 2>/dev/null | head -n1)
          [ -z "$file" ] && file=$(ls ipk-aarch64_cortex-a53/luci-app-ssr-plus*.ipk 2>/dev/null | head -n1)
          if [ -n "$file" ]; then
            base=${file##*/}
            tmp=${base#*_}
            tmp=${tmp%_all.ipk}
            version=${tmp/-/_}
            version=${version//\~/-}
            echo "ssrp_version=$version" >> $GITHUB_ENV
            echo "版本号是：$version"
          else
            echo "❌ 无法提取版本号"
            exit 1
          fi

      - name: 创建 install.sh 并打包
        run: |
          git clone https://github.com/megastep/makeself.git
          mkdir -p output

          # ipk 包 (24.10)
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A ipk-$ARCH/luci-app-ssr-plus*.ipk 2>/dev/null)" ]; then
              echo "⚠️ $ARCH (ipk): no main package, skip"
              continue
            fi
            cat <<'EOF' > "ipk-$ARCH/install.sh"
          #!/bin/sh
          opkg update
          if [ $? -ne 0 ]; then
              echo "update failed"
              exit 1
          fi
          opkg install depends/*.ipk --force-depends
          opkg install *.ipk --force-depends
          EOF
            chmod +x "ipk-$ARCH/install.sh"
            cp -r "ipk-$ARCH" makeself/
            cd makeself
            ./makeself.sh "ipk-$ARCH/" "../output/ssrp_${ssrp_version}_ipk_${ARCH}.run" "ssrp ${ARCH} v${ssrp_version} (ipk for 24.10)" ./install.sh
            cd ..
          done

          # apk 包 (25.12)
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A apk-$ARCH/luci-app-ssr-plus*.ipk 2>/dev/null)" ]; then
              echo "⚠️ $ARCH (apk): no main package, skip"
              continue
            fi
            cat <<'EOF' > "apk-$ARCH/install.sh"
          #!/bin/sh
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache --allow-untrusted depends/*.ipk *.ipk 2>/dev/null || true
          else
            opkg update
            opkg install depends/*.ipk --force-depends
            opkg install *.ipk --force-depends
          fi
          EOF
            chmod +x "apk-$ARCH/install.sh"
            cp -r "apk-$ARCH" makeself/
            cd makeself
            ./makeself.sh "apk-$ARCH/" "../output/ssrp_${ssrp_version}_apk_${ARCH}.run" "ssrp ${ARCH} v${ssrp_version} (apk for 25.12)" ./install.sh
            cd ..
          done

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV
          
      - name: Upload all .run files to GitHub Release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "ShadowsocksPlus+"
          name: SSRP-${{ env.ssrp_version }}
          body: |
            ShadowsocksR Plus+ (luci-app-ssr-plus)

            分包策略:
            - ssrp_*_ipk_*.run → 24.10 构建 (opkg 安装 .ipk)
            - ssrp_*_apk_*.run → 25.12 构建 (apk 安装 .ipk 兼容)

            文件名标识:
            - _ipk_ → 仅供 24.10 抓取
            - _apk_ → 仅供 25.12 抓取

            源: dl.openwrt.ai (kiddin9 feed)
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
