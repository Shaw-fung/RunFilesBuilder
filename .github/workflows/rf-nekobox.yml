#=================================================
# https://github.com/wukongdaily/RunFilesBuilder
# Modified: split ipk/apk packages for 24.10/25.12
# Source: dl.openwrt.ai kiddin9 feed
#=================================================
name: Make NekoBox run files

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Install makeself
        run: sudo apt-get update && sudo apt-get install -y makeself curl

      - name: 下载 24.10 ipk (NekoBox)
        run: |
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            mkdir -p "ipk-$ARCH"
            BASE_URL="https://dl.openwrt.ai/packages-24.10/${ARCH}/kiddin9/"
            page_content=$(curl -s "$BASE_URL")
            for prefix in luci-app-nekobox; do
              match=$(echo "$page_content" | grep -oP 'href="\K[^"]+\.ipk' | grep "^${prefix}_" | head -n1)
              if [ -n "$match" ]; then
                echo "⬇️ $ARCH (24.10): $match"
                curl -sL -o "ipk-${ARCH}/${match}" "${BASE_URL}${match}"
                if echo "$match" | grep -q '~'; then
                  new_name=$(echo "$match" | tr '~' '-')
                  mv "ipk-${ARCH}/${match}" "ipk-${ARCH}/${new_name}"
                fi
              else
                echo "⚠️ $ARCH: not found: $prefix"
              fi
            done
          done

      - name: 下载 25.12 兼容包 (NekoBox)
        run: |
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            mkdir -p "apk-$ARCH"
            BASE_URL="https://dl.openwrt.ai/packages-25.12/${ARCH}/kiddin9/"
            page_content=$(curl -s "$BASE_URL")
            for prefix in luci-app-nekobox; do
              match=$(echo "$page_content" | grep -oP 'href="\K[^"]+\.ipk' | grep "^${prefix}_" | head -n1)
              if [ -n "$match" ]; then
                echo "⬇️ $ARCH (25.12): $match"
                curl -sL -o "apk-${ARCH}/${match}" "${BASE_URL}${match}"
                if echo "$match" | grep -q '~'; then
                  new_name=$(echo "$match" | tr '~' '-')
                  mv "apk-${ARCH}/${match}" "apk-${ARCH}/${new_name}"
                fi
              else
                echo "⚠️ $ARCH: not found: $prefix"
              fi
            done
          done

      - name: 创建 install.sh 并打包
        run: |
          git clone https://github.com/megastep/makeself.git
          mkdir -p output
          VERSION=$(date -u -d '+8 hour' +'%Y-%m-%d')

          # ipk 包 (24.10)
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A ipk-$ARCH/*.ipk 2>/dev/null)" ]; then
              continue
            fi
            cat <<'EOF' > "ipk-$ARCH/install.sh"
          #!/bin/sh
          opkg update
          if [ $? -ne 0 ]; then
              echo "update failed"
              exit 1
          fi
          opkg install *.ipk --force-depends
          EOF
            chmod +x "ipk-$ARCH/install.sh"
            mv "ipk-$ARCH" makeself/
            cd makeself
            ./makeself.sh "ipk-$ARCH/" "../output/nekobox_${VERSION}_ipk_${ARCH}.run" "NekoBox ${ARCH} v${VERSION} (ipk for 24.10)" ./install.sh
            cd ..
          done

          # apk 包 (25.12)
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A apk-$ARCH/*.ipk 2>/dev/null)" ]; then
              continue
            fi
            cat <<'EOF' > "apk-$ARCH/install.sh"
          #!/bin/sh
          apk add --no-cache --allow-untrusted *.ipk 2>/dev/null || opkg install *.ipk --force-depends
          EOF
            chmod +x "apk-$ARCH/install.sh"
            mv "apk-$ARCH" makeself/
            cd makeself
            ./makeself.sh "apk-$ARCH/" "../output/nekobox_${VERSION}_apk_${ARCH}.run" "NekoBox ${ARCH} v${VERSION} (apk for 25.12)" ./install.sh
            cd ..
          done

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "NekoBox"
          name: "NekoBox-latest"
          body: |
            NekoBox proxy client for OpenWrt.

            分包策略:
            - nekobox_*_ipk_*.run → 24.10 构建 (opkg 安装 .ipk)
            - nekobox_*_apk_*.run → 25.12 构建 (apk 安装 .ipk 兼容)

            文件名标识:
            - _ipk_ → 仅供 24.10 抓取
            - _apk_ → 仅供 25.12 抓取

            源: dl.openwrt.ai (kiddin9 feed)
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
