name: NEW Make Passwall2 run files

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch latest release tag from Passwall2
        id: fetch_latest_tag
        run: |
          latest_tag=$(curl -s https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall2/releases/latest | jq -r '.tag_name')
          echo "LATEST_TAG=$latest_tag" >> $GITHUB_ENV

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      # ========== 24.10 ipk 分包 ==========
      - name: Download 24.10 ipk packages
        run: |
          mkdir -p downloads-ipk
          cd downloads-ipk

          # 下载 x86_64 ipk zip
          curl -L -o passwall2_packages_ipk_x86_64.zip \
          https://github.com/wkccd/storage/releases/download/pw2/passwall2_packages_ipk_x86_64.zip

          # 下载 aarch64 ipk zip
          curl -L -o passwall2_packages_ipk_aarch64_cortex-a53.zip \
          https://github.com/wkccd/storage/releases/download/pw2/passwall2_packages_ipk_aarch64_cortex-a53.zip

          # 下载luci app ipk
          curl -L -O $(
            curl -s https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall2/releases/latest \
            | jq -r '.assets[] | select(.name | test("luci-.*-passwall2.*\\.ipk")) | .browser_download_url' | head -1
          )
          # 下载luci简体中文语言包ipk
          curl -L -O "$(
            curl -s https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall2/releases/latest \
            | jq -r '.assets[]
              | select(.name | test("^luci-i18n-passwall2-zh-cn_.*\\.ipk$"))
              | .browser_download_url'
           )"

      - name: Organize 24.10 ipk for x86_64
        run: |
          mkdir -p ipk-x86_64/depends ipk-x86_64/main
          unzip -q downloads-ipk/passwall2_packages_ipk_x86_64.zip -d ipk-x86_64/depends
          cp downloads-ipk/luci-*.ipk ipk-x86_64/main/
          echo "x86_64 ipk: $(ls ipk-x86_64/depends/*.ipk 2>/dev/null | wc -l) depends + $(ls ipk-x86_64/main/*.ipk 2>/dev/null | wc -l) main"

      - name: Organize 24.10 ipk for aarch64_cortex-a53
        run: |
          mkdir -p ipk-aarch64_cortex-a53/depends ipk-aarch64_cortex-a53/main
          unzip -q downloads-ipk/passwall2_packages_ipk_aarch64_cortex-a53.zip -d ipk-aarch64_cortex-a53/depends
          cp downloads-ipk/luci-*.ipk ipk-aarch64_cortex-a53/main/
          echo "aarch64 ipk: $(ls ipk-aarch64_cortex-a53/depends/*.ipk 2>/dev/null | wc -l) depends + $(ls ipk-aarch64_cortex-a53/main/*.ipk 2>/dev/null | wc -l) main"

      - name: Organize 24.10 ipk for arm_cortex-a7_neon-vfpv4
        run: |
          mkdir -p ipk-arm_cortex-a7_neon-vfpv4/depends ipk-arm_cortex-a7_neon-vfpv4/main
          PACKAGE_VERSION="packages-24.10"
          BASE_URL="https://dl.openwrt.ai/${PACKAGE_VERSION}/arm_cortex-a7_neon-vfpv4/kiddin9/"
          echo "Fetching arm directory page from $BASE_URL"
          FILE_PREFIXES=("passwall" "chinadns-ng" "dns2socks" "hysteria" "ipt2socks" "microsocks" "naiveproxy" "redsocks2" "shadowsocksr-libev" "shadowsocks-rust" "shadow-tls" "simple-obfs-client" "tcping" "trojan" "tuic-client" "v2ray-plugin" "xray-core" "dns2tcp" "lua-neturl" "mosdns" "shadowsocks-libev-ss-server")
          EXCLUDE_PREFIXES=("luci-app-chinadns-ng" "luci-app-microsocks" "luci-app-mosdns" "luci-app-naiveproxy" "luci-app-redsocks2" "luci-app-shadowsocks")
          wget -qO- "$BASE_URL" | \
          while IFS= read -r LINE; do
              for PREFIX in "${FILE_PREFIXES[@]}"; do
                  if [[ "$LINE" == *"$PREFIX"* ]]; then
                      FILE=$(echo "$LINE" | grep -oP 'href="\K[^"]*')
                      if [[ -z "$FILE" ]]; then
                          continue
                      fi
                      exclude_file=false
                      for exclude_prefix in "${EXCLUDE_PREFIXES[@]}"; do
                          if [[ "$FILE" == $exclude_prefix* ]]; then
                              exclude_file=true
                              break
                          fi
                      done
                      if $exclude_file; then
                          continue
                      fi
                      FILE_URL="${BASE_URL}${FILE}"
                      curl -sL --fail "$FILE_URL" -o "ipk-arm_cortex-a7_neon-vfpv4/depends/$(basename $FILE_URL)"
                    fi
              done
          done
          cp downloads-ipk/luci-*.ipk ipk-arm_cortex-a7_neon-vfpv4/main/ 2>/dev/null
          echo "arm ipk: $(ls ipk-arm_cortex-a7_neon-vfpv4/depends/*.ipk 2>/dev/null | wc -l) depends + $(ls ipk-arm_cortex-a7_neon-vfpv4/main/*.ipk 2>/dev/null | wc -l) main"

      # ========== 25.12 apk 分包 ==========
      - name: Download 25.12 apk packages
        run: |
          mkdir -p downloads-apk
          cd downloads-apk

          # 从 passwall2 release 下载 apk zip (各架构)
          RELEASE_INFO=$(curl -s https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall2/releases/latest)

          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            URL=$(echo "$RELEASE_INFO" | jq -r --arg arch "$ARCH" '.assets[] | select(.name | contains("apk") and contains($arch) and endswith(".zip")) | .browser_download_url' | head -1)
            if [ -n "$URL" ]; then
              echo "⬇️ $ARCH (apk zip): $(basename $URL)"
              curl -sL -o "passwall2_apk_${ARCH}.zip" "$URL"
            else
              echo "⚠️ $ARCH: apk zip not found in release"
            fi
          done

          # 下载luci app apk (保留原始文件名,包含版本号,供apk index正确解析)
          LUCI_APP_URL=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | contains("luci-app-passwall2") and endswith(".apk")) | .browser_download_url' | head -1)
          curl -sL -o "$(basename $LUCI_APP_URL)" "$LUCI_APP_URL"
          # 下载luci简体中文语言包apk (保留原始文件名)
          LUCI_I18N_URL=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | contains("luci-i18n-passwall2-zh-cn") and endswith(".apk")) | .browser_download_url' | head -1)
          curl -sL -o "$(basename $LUCI_I18N_URL)" "$LUCI_I18N_URL"
          ls -lh *.apk 2>/dev/null || true

      - name: Organize 25.12 apk for all architectures
        run: |
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            mkdir -p "apk-$ARCH/depends" "apk-$ARCH/main"
            if [ -f "downloads-apk/passwall2_apk_${ARCH}.zip" ]; then
              unzip -q "downloads-apk/passwall2_apk_${ARCH}.zip" -d "apk-$ARCH/depends"
              echo "$ARCH apk: $(ls apk-$ARCH/depends/*.apk 2>/dev/null | wc -l) depends"
            else
              echo "⚠️ $ARCH: 无 apk zip"
            fi
            cp downloads-apk/luci-app-passwall2-*.apk "apk-$ARCH/main/" 2>/dev/null
            cp downloads-apk/luci-i18n-passwall2-zh-cn-*.apk "apk-$ARCH/main/" 2>/dev/null
            echo "  + $(ls apk-$ARCH/main/*.apk 2>/dev/null | wc -l) main"
          done

      # ========== 打包 ipk 分包 (24.10) ==========
      - name: Pack ipk run files (24.10)
        run: |
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            cat <<EOF > "ipk-$ARCH/install.sh"
          #!/bin/sh
          opkg update
          if [ \$? -ne 0 ]; then
              echo "update failed。"
              exit 1
          fi
          opkg install iptables-mod-tproxy
          opkg install iptables-mod-socket
          opkg install iptables-mod-iprange
          opkg install iptables-mod-conntrack-extra
          opkg install depends/*.ipk
          opkg install main/*.ipk
          EOF
            chmod +x "ipk-$ARCH/install.sh"
          done
          mkdir -p output
          cd makeself
          mv ../ipk-x86_64 .
          ./makeself.sh ipk-x86_64/ ../output/passwall2_ipk_x86_64_${{ env.LATEST_TAG }}.run "passwall2 x86_64 ${{ env.LATEST_TAG }} (ipk for 24.10)" ./install.sh
          mv ../ipk-aarch64_cortex-a53 .
          ./makeself.sh ipk-aarch64_cortex-a53/ ../output/passwall2_ipk_aarch64_cortex-a53_${{ env.LATEST_TAG }}.run "passwall2 aarch64_a53 ${{ env.LATEST_TAG }} (ipk for 24.10)" ./install.sh
          mv ../ipk-arm_cortex-a7_neon-vfpv4 .
          ./makeself.sh ipk-arm_cortex-a7_neon-vfpv4/ ../output/passwall2_ipk_arm_cortex-a7_neon-vfpv4_${{ env.LATEST_TAG }}.run "passwall2 arm_a7 ${{ env.LATEST_TAG }} (ipk for 24.10)" ./install.sh

      # ========== 打包 apk 分包 (25.12) ==========
      - name: Pack apk run files (25.12)
        run: |
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A apk-$ARCH/depends/*.apk 2>/dev/null)" ] && [ -z "$(ls -A apk-$ARCH/main/*.apk 2>/dev/null)" ]; then
              echo "⚠️ $ARCH: 无 apk 包,跳过打包"
              continue
            fi
            cat <<'EOF' > "apk-$ARCH/install.sh"
          #!/bin/sh
          apk add --no-cache iptables-mod-tproxy iptables-mod-socket iptables-mod-iprange iptables-mod-conntrack-extra 2>/dev/null || true
          apk add --no-cache --allow-untrusted depends/*.apk 2>/dev/null || true
          apk add --no-cache --allow-untrusted main/*.apk 2>/dev/null || true
          EOF
            chmod +x "apk-$ARCH/install.sh"
          done
          cd makeself
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A ../apk-$ARCH/depends/*.apk 2>/dev/null)" ] && [ -z "$(ls -A ../apk-$ARCH/main/*.apk 2>/dev/null)" ]; then
              continue
            fi
            mv ../apk-$ARCH .
            ./makeself.sh apk-$ARCH/ ../output/passwall2_apk_${ARCH}_${{ env.LATEST_TAG }}.run "passwall2 $ARCH ${{ env.LATEST_TAG }} (apk for 25.12)" ./install.sh
          done

      - name: Check file sizes
        run: |
          ls -lh output/*.run

      - name: Preparing release name
        run: |
          release_name=$(TZ="Asia/Shanghai" date +'%Y-%m-%d %H:%M Build')
          echo "RELEASE_NAME=$release_name" >> $GITHUB_ENV

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: ${{ env.LATEST_TAG }}
          name: "PassWall2-${{ env.LATEST_TAG }}"
          files: output/*.run
          body: |
            PassWall2 for OpenWrt / ImmortalWrt

            分包策略:
            - passwall2_ipk_*.run → 24.10 构建 (opkg 安装 .ipk)
            - passwall2_apk_*.run → 25.12 构建 (apk 安装 .apk)

            文件名标识:
            - _ipk_ → 仅供 24.10 抓取
            - _apk_ → 仅供 25.12 抓取

            源仓库: https://github.com/Openwrt-Passwall/openwrt-passwall2
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
