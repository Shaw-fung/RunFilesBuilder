#=================================================
# https://github.com/wukongdaily/RunFilesBuilder
# Modified: split ipk/apk packages for 24.10/25.12
# Description: Build Argon Theme RunFiles
#=================================================
name: Make Argon Theme run files

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  make-run:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3

      - name: 📦 安装 makeself 工具
        run: sudo apt-get update && sudo apt-get install -y makeself curl

      - name: 🚀 下载 24.10 ipk (Argon)
        run: |
          for ARCH in x86_64 aarch64_generic arm_cortex-a7_neon-vfpv4; do
            mkdir -p "ipk-$ARCH"
            BASE_URL="https://dl.openwrt.ai/packages-24.10/${ARCH}/kiddin9/"
            page_content=$(curl -s "$BASE_URL")
            for prefix in luci-theme-argon luci-app-argon-config luci-i18n-argon-config-zh-cn; do
              match=$(echo "$page_content" | grep -oP 'href="\K[^"]+\.ipk' | grep "^${prefix}_" | head -n1)
              if [ -n "$match" ]; then
                echo "⬇️ $ARCH (24.10): $match"
                curl -sL -o "ipk-${ARCH}/${match}" "${BASE_URL}${match}"
                # 处理 ~ 字符
                if echo "$match" | grep -q '~'; then
                  new_name=$(basename "$match" | tr '~' '-')
                  mv "ipk-${ARCH}/${match}" "ipk-${ARCH}/${new_name}"
                  echo "  重命名: $match -> $new_name"
                fi
              else
                echo "⚠️ $ARCH: not found: $prefix"
              fi
            done
          done

      - name: 🚀 下载 25.12 兼容包 (Argon, ipk format, apk-installable)
        run: |
          for ARCH in x86_64 aarch64_generic arm_cortex-a7_neon-vfpv4; do
            mkdir -p "apk-$ARCH"
            BASE_URL="https://dl.openwrt.ai/packages-25.12/${ARCH}/kiddin9/"
            page_content=$(curl -s "$BASE_URL")
            for prefix in luci-theme-argon luci-app-argon-config luci-i18n-argon-config-zh-cn; do
              match=$(echo "$page_content" | grep -oP 'href="\K[^"]+\.ipk' | grep "^${prefix}_" | head -n1)
              if [ -n "$match" ]; then
                echo "⬇️ $ARCH (25.12): $match"
                curl -sL -o "apk-${ARCH}/${match}" "${BASE_URL}${match}"
                # 处理 ~ 字符
                if echo "$match" | grep -q '~'; then
                  new_name=$(basename "$match" | tr '~' '-')
                  mv "apk-${ARCH}/${match}" "apk-${ARCH}/${new_name}"
                  echo "  重命名: $match -> $new_name"
                fi
              else
                echo "⚠️ $ARCH: not found: $prefix"
              fi
            done
          done

      - name: 🔍 提取版本号并打包
        id: pack
        run: |
          git clone https://github.com/megastep/makeself.git
          mkdir -p output

          # 获取版本
          ARGON_IPK=$(ls ipk-x86_64/luci-theme-argon_*.ipk 2>/dev/null | head -n 1)
          if [ -z "$ARGON_IPK" ]; then
            echo "❌ 无法提取版本号"
            exit 1
          fi
          VERSION=$(basename "$ARGON_IPK" | sed -n 's/^luci-theme-argon_\([^-]*-[^_]*\)_.*$/\1/p')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "版本: $VERSION"

          # ipk 包 (24.10)
          for ARCH in x86_64 aarch64_generic arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A ipk-$ARCH/*.ipk 2>/dev/null)" ]; then
              continue
            fi
            cat <<'EOF' > "ipk-$ARCH/install.sh"
          #!/bin/sh
          opkg update
          opkg install *.ipk --force-depends
          EOF
            chmod +x "ipk-$ARCH/install.sh"
            mv "ipk-$ARCH" makeself/
            cd makeself
            ./makeself.sh "ipk-$ARCH/" "../output/luci-theme-argon_${VERSION}_ipk_${ARCH}.run" "argon ${ARCH} v${VERSION} (ipk for 24.10)" ./install.sh
            cd ..
          done

          # apk 包 (25.12)
          for ARCH in x86_64 aarch64_generic arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A apk-$ARCH/*.ipk 2>/dev/null)" ]; then
              continue
            fi
            cat <<'EOF' > "apk-$ARCH/install.sh"
          #!/bin/sh
          apk add --no-cache --allow-untrusted *.ipk 2>/dev/null || opkg install *.ipk --force-depends
          EOF
            chmod +x "apk-$ARCH/install.sh"
            mv "apk-$ARCH" makeself/
            cd makeself
            ./makeself.sh "apk-$ARCH/" "../output/luci-theme-argon_${VERSION}_apk_${ARCH}.run" "argon ${ARCH} v${VERSION} (apk for 25.12)" ./install.sh
            cd ..
          done

      - name: Check file sizes
        run: |
          ls -lh output/*.run

      - name: 📤 上传 .run 文件到 release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "argon-${{ steps.pack.outputs.version }}"
          name: "argon-${{ steps.pack.outputs.version }}"
          body: |
            Argon Theme (luci-theme-argon + luci-app-argon-config)

            分包策略:
            - luci-theme-argon_*_ipk_*.run → 24.10 构建 (opkg 安装 .ipk)
            - luci-theme-argon_*_apk_*.run → 25.12 构建 (apk 安装 .ipk 兼容)

            文件名标识:
            - _ipk_ → 仅供 24.10 抓取
            - _apk_ → 仅供 25.12 抓取

            源: https://dl.openwrt.ai/ kiddin9 feed
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
