name: Make Lucky run files

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Install makeself
        run: sudo apt-get update && sudo apt-get install -y makeself curl jq

      - name: Download lucky from GitHub releases
        run: |
          mkdir -p x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4
          
          # 获取最新 release 信息
          RELEASE_INFO=$(curl -s https://api.github.com/repos/gdy666/lucky/releases/latest)
          
          # 下载 lucky binary ipks
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            # 尝试多种文件名模式
            URL=$(echo "$RELEASE_INFO" | grep -oP '"browser_download_url":\s*"\K[^"]*lucky[^"]*'"$ARCH"'[^"]*\.ipk' | head -n1)
            if [ -n "$URL" ]; then
              echo "⬇️ 下载 lucky $ARCH: $URL"
              curl -sL -o "${ARCH}/lucky.ipk" "$URL"
            else
              echo "⚠️ lucky $ARCH: 未找到，尝试 arm 通用包"
              # 尝试 arm 通用包
              URL=$(echo "$RELEASE_INFO" | grep -oP '"browser_download_url":\s*"\K[^"]*lucky[^"]*arm[^"]*\.ipk' | head -n1)
              if [ -n "$URL" ]; then
                curl -sL -o "${ARCH}/lucky.ipk" "$URL"
              else
                echo "❌ lucky $ARCH: 完全未找到"
              fi
            fi
          done
          
          # 下载 luci-app-lucky (all-arch)
          for pkg in luci-app-lucky luci-i18n-lucky-zh-cn; do
            URL=$(echo "$RELEASE_INFO" | grep -oP '"browser_download_url":\s*"\K[^"]*'"$pkg"'[^"]*\.ipk' | head -n1)
            if [ -n "$URL" ]; then
              for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
                curl -sL -o "${ARCH}/$(basename $URL)" "$URL"
              done
            else
              echo "⚠️ 未找到: $pkg, 尝试从 dl.openwrt.ai 下载"
              for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
                BASE_URL="https://dl.openwrt.ai/packages-24.10/${ARCH}/kiddin9/"
                page=$(curl -s "$BASE_URL")
                match=$(echo "$page" | grep -oP 'href="\K[^"]+\.ipk' | grep "^${pkg}_" | head -n1)
                if [ -n "$match" ]; then
                  curl -sL -o "${ARCH}/${match}" "${BASE_URL}${match}"
                fi
              done
            fi
          done

      - name: Create install.sh and pack
        run: |
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ "$(ls -A $ARCH 2>/dev/null)" ]; then
              cat <<EOF > "$ARCH/install.sh"
          #!/bin/sh
          opkg update
          if [ \$? -ne 0 ]; then
              echo "update failed"
              exit 1
          fi
          opkg install *.ipk --force-depends
          EOF
              chmod +x "$ARCH/install.sh"
            fi
          done
          git clone https://github.com/megastep/makeself.git
          mkdir -p output
          VERSION=$(date -u -d '+8 hour' +'%Y-%m-%d')
          cd makeself
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ "$(ls -A ../$ARCH 2>/dev/null)" ]; then
              mv ../$ARCH .
              ./makeself.sh $ARCH/ ../output/lucky_${VERSION}_${ARCH}.run "Lucky ${ARCH} v${VERSION}" ./install.sh
            fi
          done

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "Lucky"
          name: "Lucky-latest"
          body: "Lucky - 软硬路由公网神器, IPv6/IPv4 端口转发, 反向代理"
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
