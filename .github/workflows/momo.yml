name: Make momo run files (ipk + apk)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch latest release tag from momo
        id: fetch_latest_tag
        run: |
          latest_tag=$(curl -s https://api.github.com/repos/nikkinikki-org/OpenWrt-momo/releases/latest | jq -r '.tag_name')
          echo "LATEST_TAG=$latest_tag" >> $GITHUB_ENV

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Download 24.10 ipk tar.gz
        run: |
          RELEASE_INFO=$(curl -s https://api.github.com/repos/nikkinikki-org/OpenWrt-momo/releases/latest)
          for ARCH in aarch64_cortex-a53 x86_64 arm_cortex-a7_neon-vfpv4; do
            URL=$(echo "$RELEASE_INFO" | python3 -c "          import json,sys,re
          d=json.load(sys.stdin)
          arch='$ARCH'
          for a in d['assets']:
              if arch in a['name'] and '24.10' in a['name'] and a['name'].endswith('.tar.gz'):
                  print(a['browser_download_url'])
                  break")
            if [ -n "$URL" ]; then
              echo "⬇️ $ARCH (24.10 ipk): $(basename $URL)"
              mkdir -p "ipk-$ARCH"
              curl -sL -o "${ARCH}_24.10.tar.gz" "$URL"
              tar --one-top-level=ipk-$ARCH -xzf "${ARCH}_24.10.tar.gz"
              # 移除可能的子目录嵌套
              find ipk-$ARCH -name "*.ipk" -exec mv {} ipk-$ARCH/ \; 2>/dev/null || true
              find ipk-$ARCH -mindepth 1 -type d -delete 2>/dev/null || true
              # 处理文件名中的 ~ 字符
              pushd "ipk-$ARCH" >/dev/null
              for f in *~*.ipk; do
                [ -e "$f" ] || continue
                new_f=$(echo "$f" | tr -d '~')
                [ "$f" != "$new_f" ] && mv "$f" "$new_f" && echo "  重命名: $f -> $new_f"
              done
              popd >/dev/null
              rm -f "${ARCH}_24.10.tar.gz"
              echo "  ipk 文件数: $(ls ipk-$ARCH/*.ipk 2>/dev/null | wc -l)"
            else
              echo "⚠️ $ARCH: 24.10 ipk tar.gz not found"
            fi
          done

      - name: Download 25.12 apk tar.gz
        run: |
          RELEASE_INFO=$(curl -s https://api.github.com/repos/nikkinikki-org/OpenWrt-momo/releases/latest)
          for ARCH in aarch64_cortex-a53 x86_64 arm_cortex-a7_neon-vfpv4; do
            URL=$(echo "$RELEASE_INFO" | python3 -c "          import json,sys,re
          d=json.load(sys.stdin)
          arch='$ARCH'
          for a in d['assets']:
              if arch in a['name'] and '25.12' in a['name'] and a['name'].endswith('.tar.gz'):
                  print(a['browser_download_url'])
                  break")
            if [ -n "$URL" ]; then
              echo "⬇️ $ARCH (25.12 apk): $(basename $URL)"
              mkdir -p "apk-$ARCH"
              curl -sL -o "${ARCH}_25.12.tar.gz" "$URL"
              tar --one-top-level=apk-$ARCH -xzf "${ARCH}_25.12.tar.gz"
              # 移除可能的子目录嵌套
              find apk-$ARCH -name "*.apk" -exec mv {} apk-$ARCH/ \; 2>/dev/null || true
              find apk-$ARCH -mindepth 1 -type d -delete 2>/dev/null || true
              rm -f "${ARCH}_25.12.tar.gz"
              echo "  apk 文件数: $(ls apk-$ARCH/*.apk 2>/dev/null | wc -l)"
            else
              echo "⚠️ $ARCH: 25.12 apk tar.gz not found"
            fi
          done

      - name: Create install.sh and pack (ipk 分包 - 24.10)
        run: |
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A ipk-$ARCH/*.ipk 2>/dev/null)" ]; then
              echo "⚠️ $ARCH: 无 ipk 包,跳过打包"
              continue
            fi
            cat <<'EOF' > "ipk-$ARCH/install.sh"
          #!/bin/sh
          opkg update
          if [ $? -ne 0 ]; then
              echo "update failed。"
              exit 1
          fi
          opkg install *.ipk
          EOF
            chmod +x "ipk-$ARCH/install.sh"
          done
          mkdir -p output
          cd makeself
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A ../ipk-$ARCH/*.ipk 2>/dev/null)" ]; then
              continue
            fi
            mv ../ipk-$ARCH .
            ./makeself.sh ipk-$ARCH/ ../output/momo_${{ env.LATEST_TAG }}_ipk_${ARCH}.run "momo ${{ env.LATEST_TAG }} ${ARCH} (ipk for 24.10)" ./install.sh
          done

      - name: Create install.sh and pack (apk 分包 - 25.12)
        run: |
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A apk-$ARCH/*.apk 2>/dev/null)" ]; then
              echo "⚠️ $ARCH: 无 apk 包,跳过打包"
              continue
            fi
            cat <<'EOF' > "apk-$ARCH/install.sh"
          #!/bin/sh
          apk add --no-cache --allow-untrusted *.apk || true
          EOF
            chmod +x "apk-$ARCH/install.sh"
          done
          cd makeself
          for ARCH in x86_64 aarch64_cortex-a53 arm_cortex-a7_neon-vfpv4; do
            if [ -z "$(ls -A ../apk-$ARCH/*.apk 2>/dev/null)" ]; then
              continue
            fi
            mv ../apk-$ARCH .
            ./makeself.sh apk-$ARCH/ ../output/momo_${{ env.LATEST_TAG }}_apk_${ARCH}.run "momo ${{ env.LATEST_TAG }} ${ARCH} (apk for 25.12)" ./install.sh
          done

      - name: Check file sizes
        run: |
          ls -lh output/*.run

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: ${{ env.LATEST_TAG }}
          name: "momo-${{ env.LATEST_TAG }}"
          files: output/*.run
          body: |
            momo proxy for OpenWrt / ImmortalWrt

            分包策略:
            - momo_*_ipk_*.run → 24.10 构建 (opkg 安装 .ipk)
            - momo_*_apk_*.run → 25.12 构建 (apk 安装 .apk)

            文件名标识:
            - _ipk_ → 仅供 24.10 抓取
            - _apk_ → 仅供 25.12 抓取

            源仓库: https://github.com/nikkinikki-org/OpenWrt-momo
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
