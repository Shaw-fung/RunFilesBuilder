name: Make Amlogic run files

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Install makeself
        run: sudo apt-get update && sudo apt-get install -y makeself curl jq

      - name: Download luci-app-amlogic from GitHub releases
        run: |
          mkdir -p aarch64_cortex-a53
          
          # 获取最新 release 信息
          RELEASE_INFO=$(curl -s https://api.github.com/repos/ophub/luci-app-amlogic/releases/latest)
          
          # 下载所有 ipk 文件
          echo "$RELEASE_INFO" | grep -oP '"browser_download_url":\s*"\K[^"]*\.ipk' | while read -r URL; do
            if [ -n "$URL" ]; then
              echo "⬇️ 下载: $(basename $URL)"
              curl -sL -o "aarch64_cortex-a53/$(basename $URL)" "$URL"
            fi
          done
          
          # 也尝试从 dl.openwrt.ai 下载
          BASE_URL="https://dl.openwrt.ai/packages-24.10/aarch64_cortex-a53/kiddin9/"
          page=$(curl -s "$BASE_URL")
          for prefix in luci-app-amlogic; do
            match=$(echo "$page" | grep -oP 'href="\K[^"]+\.ipk' | grep "^${prefix}_" | head -n1)
            if [ -n "$match" ]; then
              echo "⬇️ 从 dl.openwrt.ai 下载: $match"
              curl -sL -o "aarch64_cortex-a53/${match}" "${BASE_URL}${match}"
            fi
          done
          
          ls -lh aarch64_cortex-a53/

      - name: Create install.sh and pack
        run: |
          cat <<EOF > aarch64_cortex-a53/install.sh
          #!/bin/sh
          opkg update
          if [ \$? -ne 0 ]; then
              echo "update failed"
              exit 1
          fi
          opkg install *.ipk --force-depends
          EOF
          chmod +x aarch64_cortex-a53/install.sh
          
          git clone https://github.com/megastep/makeself.git
          mkdir -p output
          VERSION=$(date -u -d '+8 hour' +'%Y-%m-%d')
          cd makeself
          mv ../aarch64_cortex-a53 .
          ./makeself.sh aarch64_cortex-a53/ ../output/amlogic_${VERSION}_aarch64_cortex-a53.run "Amlogic aarch64 v${VERSION}" ./install.sh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: "Amlogic"
          name: "Amlogic-latest (aarch64 only)"
          body: "luci-app-amlogic 晶晨宝盒 (仅限 ARM-64 平台)"
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
