#=================================================
# https://github.com/kenzok8/openwrt-daede
# Description: DAE (daed + luci-app-daede) Run Files Builder
# 24.10 使用 ipk (opkg) / 25.12 使用 apk (apk)
#=================================================

name: Make DAE run files

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch latest release info
        id: fetch_latest
        run: |
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/kenzok8/openwrt-daede/releases/latest)

          LATEST_TAG=$(echo "$RELEASE_INFO" | jq -r '.tag_name')

          # dae/daed 版本 (如 dae-2026.07.27-r1-x86_64.apk)
          DAE_VERSION=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | test("^dae-[0-9].*\\.apk$")) | .name' | head -1 | awk -F'-' '{print $2}')
          DAE_REV=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | test("^dae-[0-9].*\\.apk$")) | .name' | head -1 | awk -F'-' '{print $3}')

          # luci-app-daede 版本 (如 luci-app-daede-1.14.7-r17-aarch64_cortex-a53.apk)
          LUCI_VERSION=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | test("^luci-app-daede-.*\\.apk$")) | .name' | head -1 | awk -F'-' '{print $4}')
          LUCI_REV=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | test("^luci-app-daede-.*\\.apk$")) | .name' | head -1 | awk -F'-' '{print $5}')

          # vmlinux-btf apk 版本 (如 vmlinux-btf-6.12.94-r1-aarch64_cortex-a53.apk)
          BTF_APK_VERSION=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | test("^vmlinux-btf-.*\\.apk$")) | .name' | head -1 | awk -F'-' '{print $3}')
          BTF_APK_REV=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | test("^vmlinux-btf-.*\\.apk$")) | .name' | head -1 | awk -F'-' '{print $4}')

          # vmlinux-btf ipk 版本 (如 vmlinux-btf_6.6.141-r1_aarch64_cortex-a53.ipk)
          BTF_IPK_VERSION=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | test("^vmlinux-btf_.*\\.ipk$")) | .name' | head -1 | awk -F'_' '{print $2}' | awk -F'-' '{print $1}')
          BTF_IPK_REV=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | test("^vmlinux-btf_.*\\.ipk$")) | .name' | head -1 | awk -F'_' '{print $2}' | awk -F'-' '{print $2}')

          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "DAE_VERSION=$DAE_VERSION" >> $GITHUB_ENV
          echo "DAE_REV=$DAE_REV" >> $GITHUB_ENV
          echo "LUCI_VERSION=$LUCI_VERSION" >> $GITHUB_ENV
          echo "LUCI_REV=$LUCI_REV" >> $GITHUB_ENV
          echo "BTF_APK_VERSION=$BTF_APK_VERSION" >> $GITHUB_ENV
          echo "BTF_APK_REV=$BTF_APK_REV" >> $GITHUB_ENV
          echo "BTF_IPK_VERSION=$BTF_IPK_VERSION" >> $GITHUB_ENV
          echo "BTF_IPK_REV=$BTF_IPK_REV" >> $GITHUB_ENV

          echo "📌 Tag: $LATEST_TAG"
          echo "   dae/daed:     ${DAE_VERSION}-${DAE_REV}"
          echo "   luci-app-daede: ${LUCI_VERSION}-${LUCI_REV}"
          echo "   vmlinux-btf (apk): ${BTF_APK_VERSION}-${BTF_APK_REV}"
          echo "   vmlinux-btf (ipk): ${BTF_IPK_VERSION}-${BTF_IPK_REV}"

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      # ========== 24.10 ipk 分包 ==========
      - name: Download 24.10 ipk packages
        run: |
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/kenzok8/openwrt-daede/releases/latest)

          DAE_VER="${{ env.DAE_VERSION }}"
          DAE_REV="${{ env.DAE_REV }}"
          LUCI_VER="${{ env.LUCI_VERSION }}"
          LUCI_REV="${{ env.LUCI_REV }}"
          BTF_IPK_VER="${{ env.BTF_IPK_VERSION }}"
          BTF_IPK_REV="${{ env.BTF_IPK_REV }}"

          for ARCH in x86_64 aarch64_cortex-a53 aarch64_cortex-a72 aarch64_generic arm_cortex-a7_neon-vfpv4 arm_cortex-a9 arm_cortex-a9_neon i386_pentium4; do
            mkdir -p "ipk-$ARCH"

            # dae (core)
            URL=$(echo "$RELEASE_INFO" | jq -r --arg arch "$ARCH" --arg ver "$DAE_VER" --arg rev "$DAE_REV" \
              '.assets[] | select(.name | test("^dae_" + $ver + "-" + $rev + "_" + $arch + "\\.ipk$")) | .browser_download_url' \
              | head -1)
            if [ -n "$URL" ]; then
              echo "⬇️ $ARCH (ipk) dae: $(basename $URL)"
              curl -sL -o "ipk-$ARCH/$(basename $URL)" "$URL"
            else
              echo "⚠️ $ARCH: dae ipk not found"
            fi

            # daed (daemon)
            URL=$(echo "$RELEASE_INFO" | jq -r --arg arch "$ARCH" --arg ver "$DAE_VER" --arg rev "$DAE_REV" \
              '.assets[] | select(.name | test("^daed_" + $ver + "-" + $rev + "_" + $arch + "\\.ipk$")) | .browser_download_url' \
              | head -1)
            if [ -n "$URL" ]; then
              echo "⬇️ $ARCH (ipk) daed: $(basename $URL)"
              curl -sL -o "ipk-$ARCH/$(basename $URL)" "$URL"
            else
              echo "⚠️ $ARCH: daed ipk not found"
            fi

            # luci-app-daede (_all 架构包,每个架构目录放一份)
            LUCI_URL=$(echo "$RELEASE_INFO" | jq -r --arg ver "$LUCI_VER" --arg rev "$LUCI_REV" \
              '.assets[] | select(.name | test("^luci-app-daede_" + $ver + "-" + $rev + "_all\\.ipk$")) | .browser_download_url' \
              | head -1)
            if [ -n "$LUCI_URL" ]; then
              echo "⬇️ $ARCH (ipk) luci-app-daede: $(basename $LUCI_URL)"
              curl -sL -o "ipk-$ARCH/$(basename $LUCI_URL)" "$LUCI_URL"
            else
              echo "⚠️ $ARCH: luci-app-daede ipk not found"
            fi

            # vmlinux-btf (仅部分架构有)
            if [ -n "$BTF_IPK_VER" ]; then
              BTF_URL=$(echo "$RELEASE_INFO" | jq -r --arg arch "$ARCH" --arg ver "$BTF_IPK_VER" --arg rev "$BTF_IPK_REV" \
                '.assets[] | select(.name | test("^vmlinux-btf_" + $ver + "-" + $rev + "_" + $arch + "\\.ipk$")) | .browser_download_url' \
                | head -1)
              if [ -n "$BTF_URL" ]; then
                echo "⬇️ $ARCH (ipk) vmlinux-btf: $(basename $BTF_URL)"
                curl -sL -o "ipk-$ARCH/$(basename $BTF_URL)" "$BTF_URL"
              else
                echo "ℹ️ $ARCH: vmlinux-btf ipk not available (skipping)"
              fi
            fi

            echo "📦 $ARCH ipk packages:"
            ls -lh "ipk-$ARCH/" 2>/dev/null || echo "  (empty)"
            echo ""
          done

      # ========== 25.12 apk 分包 ==========
      - name: Download 25.12 apk packages
        run: |
          RELEASE_INFO=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/kenzok8/openwrt-daede/releases/latest)

          DAE_VER="${{ env.DAE_VERSION }}"
          DAE_REV="${{ env.DAE_REV }}"
          LUCI_VER="${{ env.LUCI_VERSION }}"
          LUCI_REV="${{ env.LUCI_REV }}"
          BTF_APK_VER="${{ env.BTF_APK_VERSION }}"
          BTF_APK_REV="${{ env.BTF_APK_REV }}"

          for ARCH in x86_64 aarch64_cortex-a53 aarch64_cortex-a72 aarch64_generic arm_cortex-a7_neon-vfpv4 arm_cortex-a9 arm_cortex-a9_neon i386_pentium4; do
            mkdir -p "apk-$ARCH"

            # dae (core) - 去除架构后缀 + 修正版本分隔符 (-r → ~r)
            URL=$(echo "$RELEASE_INFO" | jq -r --arg arch "$ARCH" --arg ver "$DAE_VER" --arg rev "$DAE_REV" \
              '.assets[] | select(.name | test("^dae-" + $ver + "-" + $rev + "-" + $arch + "\\.apk$")) | .browser_download_url' \
              | head -1)
            if [ -n "$URL" ]; then
              orig_name=$(basename "$URL")
              clean_name=$(echo "$orig_name" | sed "s/-${ARCH}//" | sed -E 's/-r([0-9]+)\.apk$/~r\1.apk/')
              echo "⬇️ $ARCH (apk) dae: $orig_name -> $clean_name"
              curl -sL -o "apk-$ARCH/$clean_name" "$URL"
            else
              echo "⚠️ $ARCH: dae apk not found"
            fi

            # daed (daemon)
            URL=$(echo "$RELEASE_INFO" | jq -r --arg arch "$ARCH" --arg ver "$DAE_VER" --arg rev "$DAE_REV" \
              '.assets[] | select(.name | test("^daed-" + $ver + "-" + $rev + "-" + $arch + "\\.apk$")) | .browser_download_url' \
              | head -1)
            if [ -n "$URL" ]; then
              orig_name=$(basename "$URL")
              clean_name=$(echo "$orig_name" | sed "s/-${ARCH}//" | sed -E 's/-r([0-9]+)\.apk$/~r\1.apk/')
              echo "⬇️ $ARCH (apk) daed: $orig_name -> $clean_name"
              curl -sL -o "apk-$ARCH/$clean_name" "$URL"
            else
              echo "⚠️ $ARCH: daed apk not found"
            fi

            # luci-app-daede
            URL=$(echo "$RELEASE_INFO" | jq -r --arg arch "$ARCH" --arg ver "$LUCI_VER" --arg rev "$LUCI_REV" \
              '.assets[] | select(.name | test("^luci-app-daede-" + $ver + "-" + $rev + "-" + $arch + "\\.apk$")) | .browser_download_url' \
              | head -1)
            if [ -n "$URL" ]; then
              orig_name=$(basename "$URL")
              clean_name=$(echo "$orig_name" | sed "s/-${ARCH}//" | sed -E 's/-r([0-9]+)\.apk$/~r\1.apk/')
              echo "⬇️ $ARCH (apk) luci-app-daede: $orig_name -> $clean_name"
              curl -sL -o "apk-$ARCH/$clean_name" "$URL"
            else
              echo "⚠️ $ARCH: luci-app-daede apk not found"
            fi

            # vmlinux-btf (仅部分架构有)
            if [ -n "$BTF_APK_VER" ]; then
              BTF_URL=$(echo "$RELEASE_INFO" | jq -r --arg arch "$ARCH" --arg ver "$BTF_APK_VER" --arg rev "$BTF_APK_REV" \
                '.assets[] | select(.name | test("^vmlinux-btf-" + $ver + "-" + $rev + "-" + $arch + "\\.apk$")) | .browser_download_url' \
                | head -1)
              if [ -n "$BTF_URL" ]; then
                orig_name=$(basename "$BTF_URL")
                clean_name=$(echo "$orig_name" | sed "s/-${ARCH}//" | sed -E 's/-r([0-9]+)\.apk$/~r\1.apk/')
                echo "⬇️ $ARCH (apk) vmlinux-btf: $orig_name -> $clean_name"
                curl -sL -o "apk-$ARCH/$clean_name" "$BTF_URL"
              else
                echo "ℹ️ $ARCH: vmlinux-btf apk not available (skipping)"
              fi
            fi

            echo "📦 $ARCH apk packages:"
            ls -lh "apk-$ARCH/" 2>/dev/null || echo "  (empty)"
            echo ""
          done

      # ========== 打包 ipk 分包 (24.10) ==========
      - name: Pack ipk run files (24.10)
        run: |
          mkdir -p output
          cd makeself
          for ARCH in x86_64 aarch64_cortex-a53 aarch64_cortex-a72 aarch64_generic arm_cortex-a7_neon-vfpv4 arm_cortex-a9 arm_cortex-a9_neon i386_pentium4; do
            if [ -z "$(ls -A ../ipk-$ARCH/*.ipk 2>/dev/null)" ]; then
              echo "⚠️ $ARCH: 无 ipk 包,跳过打包"
              continue
            fi
            cat <<EOF > "../ipk-$ARCH/install.sh"
          #!/bin/sh
          opkg update
          if [ \$? -ne 0 ]; then
              echo "update failed"
              exit 1
          fi
          opkg install *.ipk --force-depends
          EOF
            chmod +x "../ipk-$ARCH/install.sh"
            mv "../ipk-$ARCH" .
            ./makeself.sh "ipk-$ARCH/" "../output/dae_${{ env.DAE_VERSION }}_ipk_${ARCH}.run" \
              "dae ${{ env.DAE_VERSION }} $ARCH (ipk for 24.10)" ./install.sh
          done

      # ========== 打包 apk 分包 (25.12) ==========
      - name: Pack apk run files (25.12)
        run: |
          cd makeself
          for ARCH in x86_64 aarch64_cortex-a53 aarch64_cortex-a72 aarch64_generic arm_cortex-a7_neon-vfpv4 arm_cortex-a9 arm_cortex-a9_neon i386_pentium4; do
            if [ -z "$(ls -A ../apk-$ARCH/*.apk 2>/dev/null)" ]; then
              echo "⚠️ $ARCH: 无 apk 包,跳过打包"
              continue
            fi
            cat <<EOF > "../apk-$ARCH/install.sh"
          #!/bin/sh
          apk add --no-cache --allow-untrusted *.apk || true
          EOF
            chmod +x "../apk-$ARCH/install.sh"
            mv "../apk-$ARCH" .
            ./makeself.sh "apk-$ARCH/" "../output/dae_${{ env.DAE_VERSION }}_apk_${ARCH}.run" \
              "dae ${{ env.DAE_VERSION }} $ARCH (apk for 25.12)" ./install.sh
          done

      - name: Check file sizes
        run: |
          echo "=== Generated .run files ==="
          ls -lh output/*.run 2>/dev/null || echo "❌ No .run files generated"

      - name: Upload run files as release assets
        uses: softprops/action-gh-release@v2.1.0
        with:
          tag_name: ${{ env.LATEST_TAG }}
          name: "dae-${{ env.DAE_VERSION }}"
          files: output/*.run
          body: |
            DAE (daed + luci-app-daede) for OpenWrt / ImmortalWrt

            分包策略:
            - dae_*_ipk_*.run → 24.10 构建 (opkg 安装 .ipk)
            - dae_*_apk_*.run → 25.12 构建 (apk 安装 .apk)

            文件名标识:
            - _ipk_ → 仅供 24.10 抓取
            - _apk_ → 仅供 25.12 抓取

            包含组件:
            - dae (核心)
            - daed (守护进程)
            - luci-app-daede (LuCI 界面)
            - vmlinux-btf (内核依赖,部分架构可用)

            源仓库: https://github.com/kenzok8/openwrt-daede
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
